name: windows_build_test
on: [pull_request]
env:
  SOLUTION_FILE_PATH: RhythmActionGame.sln

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        configuration:
          - Debug
          - Release
    
    runs-on: self-hosted
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
    
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
    
      - shell: powershell
        run: |
          msbuild $env:SOLUTION_FILE_PATH /t:Clean /p:Platform=x64,Configuration=${{ matrix.configuration }}
          msbuild $env:SOLUTION_FILE_PAss /t:Build /m /p:Platform=x64,Configuration=${{ matrix.configuration }} *>&1 | Tee-Object build.log
      - name: Upload log to Discord
        if: failure()
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOKURL_LOGGER }}
        run: |
          pwsh --version
          if -Not (Test-Path build.log) { exit 1 }

          $payload = @{
            embeds = @(
              @{
                title = "Job Failed (${{ matrix.configuration }})"
                url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                color = 15548997

                author = @{
                  name = "GitHub Actions"
                  url = "https://github.com/Souto-Naitou/BEATSLASH/actions"
                  icon_url = "https://drive.google.com/uc?id=1Qp-YcNpbMzaXENi8c7wvss6CzZ5-J4rG"
                }

                fields = @(
                  @{
                    name = "PR"
                    value = "[${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})"
                    inline = $false
                  },
                  @{
                    name = "Branch"
                    value = "${{ github.head_ref }}"
                    inline = $true
                  },
                  @{
                    name = "Author"
                    value = "${{ github.event.pull_request.user.login }}"
                    inline = $true
                  }
                )
              }
            )
          }

          $json = $payload | ConvertTo-Json -Depth 10 -Compress

          Write-Host $json

          Invoke-RestMethod `
              -Uri $env:WEBHOOK `
              -Method Post `
              -Form @{
                  payload_json = $json
                  file1 = Get-Item build.log
              }

