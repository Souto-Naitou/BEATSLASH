name: windows_build_test
on: [pull_request]
env:
  SOLUTION_FILE_PATH: RhythmActionGame.sln

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize submodules
        shell: pwsh
        run: |
          if (Test-Path ".git/modules") {
            Remove-Item -Recurse -Force ".git/modules"
          }
          if (Test-Path "module/TakoEngine") {
            Remove-Item -Recurse -Force "module/TakoEngine"
          }
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        run: |
          msbuild ${{env.SOLUTION_FILE_PATH}} /t:Clean /p:Platform=x64,Configuration=${{matrix.configuration}}
          msbuild ${{env.SOLUTION_FILE_PATH}} /t:Build /p:Platform=x64,Configuration=${{matrix.configuration}}
